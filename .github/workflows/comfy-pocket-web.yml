name: Comfy Pocket website checks
on:
  pull_request:
    paths: ['web/comfy-pocket/**', 'comfy-pocket/**', '.github/workflows/comfy-pocket-web.yml']
  push:
    branches: [main]
    paths: ['web/comfy-pocket/**', 'comfy-pocket/**', '.github/workflows/comfy-pocket-web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/comfy-pocket
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/comfy-pocket/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build-storybook -- --disable-telemetry
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: comfy-pocket-playwright-report
          path: web/comfy-pocket/playwright-report/
          retention-days: 7
